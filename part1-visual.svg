<svg xmlns="http://www.w3.org/2000/svg" width="240" height="72" viewBox="0 0 240 72" fill="currentColor" color="#9aa4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .tag { animation: tag 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bar { animation: bar 2.8s ease-in-out infinite; }
    .caret { animation: caret 1.4s steps(1) infinite; }
    @keyframes tag { 0%, 10% { opacity: 0; transform: scale(.8) } 28%, 84% { opacity: .9; transform: scale(1) } 100% { opacity: 0 } }
    @keyframes bar { 0%, 18% { opacity: .35 } 36%, 90% { opacity: 1 } 100% { opacity: .35 } }
    @keyframes caret { 50% { opacity: 0 } }
  </style>
  <text x="12" y="24" font-size="11" opacity=".45">Updated</text>
  <text x="68" y="24" font-size="11">out/report.md</text>
  <g class="tag"><text x="158" y="24" font-size="11" font-weight="700">[1]</text></g>
  <text x="12" y="40" font-size="11" opacity=".45">and</text>
  <text x="34" y="40" font-size="11">src/app.ts:12</text>
  <g class="tag" style="animation-delay:.15s"><text x="124" y="40" font-size="11" font-weight="700">[2]</text></g>
  <g class="bar">
    <rect x="12" y="50" width="216" height="1" opacity=".15"/>
    <text x="12" y="66" font-size="9" opacity=".85">● Paths 2</text>
    <text x="62" y="66" font-size="9" opacity=".55">· type number · esc</text>
    <rect class="caret" x="178" y="58" width="5" height="9" opacity=".5"/>
  </g>
</svg>
